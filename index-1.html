<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#061426">
<title>BW ATM Finder — Live JSON Edition</title>
<style>
:root {
  --bg: #061426;
  --panel: rgba(11, 29, 50, 0.7);
  --panel-border: rgba(170, 215, 245, 0.18);
  --text: #eef7ff;
  --muted: #9fb6cc;
  --teal: #00ffcc;
  --blue: #168bff;
  --green: #28dca0;
  --orange: #ffbf57;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: radial-gradient(circle at 15% 15%, #0f3057 0%, #061426 70%);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}
header {
  height: 66px; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between;
  background: rgba(7, 24, 43, 0.8); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--panel-border); z-index: 5; position: relative;
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center;
  background: linear-gradient(135deg, #00ffcc, #168bff); color: #041b27; font-weight: bold; font-size: 20px;
  box-shadow: 0 4px 20px rgba(0, 255, 204, 0.35);
}
header h1 { font-size: 18px; } header p { font-size: 12px; color: var(--muted); }
.badge-top { font-size: 10px; font-weight: 800; padding: 6px 12px; border-radius: 20px; background: rgba(0,255,204,0.1); border: 1px solid rgba(0,255,204,0.3); color: var(--teal); }
.layout { height: calc(100vh - 66px); display: grid; grid-template-columns: 380px minmax(0, 1fr); }
.sidebar { background: var(--panel); backdrop-filter: blur(25px); border-right: 1px solid var(--panel-border); display: flex; flex-direction: column; min-height: 0; z-index: 2; }
.filters { padding: 16px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--panel-border); }
input, select {
  width: 100%; background: rgba(6, 20, 38, 0.75); border: 1px solid rgba(42, 73, 104, 0.6);
  border-radius: 12px; padding: 11px 13px; color: white; font-size: 13px; outline: none; transition: 0.25s;
}
input:focus, select:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(0, 255, 204, 0.15); }
select option { background: #0b1d32; color: white; }
.row { display: flex; gap: 8px; } .row > * { flex: 1; }
button {
  border: 0; border-radius: 12px; padding: 11px 14px; background: linear-gradient(110deg, #168bff, #00ffcc);
  color: #041b27; font-weight: 800; font-size: 12px; cursor: pointer; transition: 0.2s;
}
button:hover { opacity: 0.9; transform: translateY(-1px); }
button.secondary { background: rgba(19, 45, 71, 0.65); border: 1px solid rgba(42, 74, 104, 0.8); color: var(--text); }
#statusMsg { font-size: 11px; color: var(--muted); }
#atmList { overflow-y: auto; flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.atm-card {
  background: rgba(12, 32, 53, 0.55); border: 1px solid var(--panel-border); border-radius: 14px; padding: 14px; cursor: pointer; transition: 0.2s; backdrop-filter: blur(12px);
}
.atm-card:hover { border-color: var(--teal); background: rgba(15, 38, 63, 0.8); transform: translateY(-2px); }
.atm-title { font-weight: 800; color: #79dbe1; font-size: 14px; }
.bank { font-size: 12px; font-weight: 700; margin-top: 3px; color: #d0e7ff; }
.address { font-size: 12px; color: var(--muted); margin: 6px 0; line-height: 1.4; }
.badge { font-size: 10px; padding: 3px 8px; border-radius: 20px; font-weight: 800; }
.verified { background: rgba(40, 220, 160, 0.15); color: var(--green); border: 1px solid rgba(40, 220, 160, 0.3); }
.tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
.tag { font-size: 10px; padding: 3px 7px; background: rgba(0, 255, 204, 0.08); color: #a8eff0; border-radius: 6px; border: 1px solid rgba(0, 255, 204, 0.15); }
.map-area { position: relative; background: rgba(2, 9, 22, 0.5); }
#globeViz { width: 100%; height: 100%; min-height: 300px; }
.map-tools { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; z-index: 4; pointer-events: none; }
.map-tools > * { pointer-events: auto; }
.map-chip { font-size: 12px; padding: 10px 14px; background: rgba(11, 29, 50, 0.75); border: 1px solid var(--panel-border); border-radius: 12px; backdrop-filter: blur(15px); }
.map-actions { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 8px; z-index: 4; }
.empty { padding: 25px; text-align: center; color: var(--muted); font-size: 13px; }
@media(max-width: 760px) {
  body { overflow: auto; height: 100dvh; }
  .layout { height: calc(100dvh - 66px); display: flex; flex-direction: column; }
  .map-area { height: 48%; min-height: 260px; order: 0; }
  .sidebar { height: 52%; order: 1; border-right: 0; border-top: 1px solid var(--panel-border); }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🏧</div>
    <div><h1>BW ATM Finder</h1><p>Interactive 3D Earth & JSON Directory</p></div>
  </div>
  <div class="badge-top">BOTSWANA 🇧🇼</div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="filters">
      <input id="searchInput" placeholder="Search town, bank or address…" aria-label="Search">
      <div class="row">
        <select id="bankFilter"><option value="">All Banks</option></select>
        <select id="serviceFilter">
          <option value="">All Services</option>
          <option value="cash_withdrawal">Cash Withdrawal</option>
          <option value="deposit">Deposit</option>
        </select>
      </div>
      <div class="row">
        <button id="locateBtn" type="button">Use my location</button>
        <button id="resetBtn" class="secondary" type="button">Reset globe</button>
      </div>
      <div id="statusMsg">Fetching JSON database…</div>
    </div>
    <div id="atmList"><div class="empty">Loading ATMs from JSON file…</div></div>
  </aside>

  <section class="map-area">
    <div id="globeViz"></div>
    <div class="map-tools"><div class="map-chip">🌍 3D Globe View</div><div class="map-chip">Tap pin for details</div></div>
    <div class="map-actions">
      <button class="secondary" id="zoomOut" type="button">−</button>
      <button id="zoomIn" type="button">＋ Zoom</button>
    </div>
  </section>
</div>

<script src="https://unpkg.com/globe.gl"></script>
<script>
// Multiple robust paths to safely locate your JSON file on GitHub Pages
const DATA_PATHS = [
  "./data/botswana_atms.json",
  "/botswana-atm-finder/data/botswana_atms.json",
  "data/botswana_atms.json",
  "https://raw.githubusercontent.com/titang11/botswana-atm-finder/main/data/botswana_atms.json"
];

let atmsData = [], globe, altitude = 1.6;
const $ = id => document.getElementById(id);

function initGlobe() {
  if (typeof Globe !== 'function') return;
  globe = Globe()($('globeViz'))
    .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
    .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
    .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
    .showAtmosphere(true).atmosphereColor('#00ffcc').atmosphereAltitude(0.2)
    .pointLat(d => Number(d.latitude)).pointLng(d => Number(d.longitude))
    .pointColor(() => '#28dca0')
    .pointAltitude(0.025).pointRadius(0.22)
    .pointLabel(d => `<div style="background:rgba(11,29,50,0.9);color:white;padding:10px;border:1px solid rgba(0,255,204,0.4);border-radius:10px;max-width:220px"><b>${d.atm_name}</b><br><span style="color:#00ffcc">${d.bank}</span><br><small>${d.town}</small></div>`)
    .onPointClick(d => {
      if (globe && d.latitude && d.longitude) {
        globe.pointOfView({ lat: Number(d.latitude), lng: Number(d.longitude), altitude: 0.35 }, 800);
      }
    });
  globe.pointOfView({ lat: -22.3, lng: 24.7, altitude }, 0);
}

function render(list) {
  $('statusMsg').textContent = `Loaded ${list.length} ATM location(s)`;
  const valid = list.filter(a => a.latitude && a.longitude);
  if (globe) globe.pointsData(valid);

  if (!list.length) {
    $('atmList').innerHTML = '<div class="empty">No matching ATMs found.</div>';
    return;
  }

  $('atmList').innerHTML = list.map((a, i) => `
    <article class="atm-card" onclick="focusAtm(${a.latitude}, ${a.longitude})">
      <div style="display:flex;justify-content:space-between;align-items:start">
        <div class="atm-title">${a.atm_name || 'ATM'}</div>
        <span class="badge verified">${a.verification_status || 'verified'}</span>
      </div>
      <div class="bank">${a.bank}</div>
      <div class="address">📍 <b>${a.town}</b> — ${a.address || ''}</div>
    </article>
  `).join('');
}

function focusAtm(lat, lng) {
  if (globe && lat && lng) {
    globe.pointOfView({ lat: Number(lat), lng: Number(lng), altitude: 0.35 }, 800);
  }
}

function filterAtms() {
  const q = $('searchInput').value.toLowerCase();
  const bank = $('bankFilter').value;
  render(atmsData.filter(a => {
    const text = [a.atm_name, a.bank, a.town, a.address].join(' ').toLowerCase();
    return (!q || text.includes(q)) && (!bank || a.bank === bank);
  }));
}

async function loadAtms() {
  let loaded = false;
  for (const path of DATA_PATHS) {
    try {
      const res = await fetch(path);
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          atmsData = data;
          loaded = true;
          break;
        }
      }
    } catch(e) {}
  }

  if (!loaded) {
    $('statusMsg').textContent = 'Failed to load JSON file';$('atmList').innerHTML = '<div class="empty">Could not load <code>data/botswana_atms.json</code>. Check your repository file path.</div>';
    return;
  }

  // Populate Bank Dropdown dynamically from JSON data
  const banks = [...new Set(atmsData.map(a => a.bank))].sort();
  const bankSelect = $('bankFilter');
  banks.forEach(b => {
    const opt = document.createElement('option');
    opt.value = b; opt.textContent = b;
    bankSelect.appendChild(opt);
  });

  filterAtms();
}

$('searchInput').addEventListener('input', filterAtms);$('bankFilter').addEventListener('change', filterAtms);
$('serviceFilter').addEventListener('change', filterAtms);$('resetBtn').addEventListener('click', () => globe.pointOfView({ lat: -22.3, lng: 24.7, altitude: 1.6 }, 800));

initGlobe();
loadAtms();
</script>
</body>
</html>
