<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#061426">
<meta name="description" content="Find ATM locations across Botswana with BW ATM Finder.">
<title>BW ATM Finder — 3D Globe</title>
<style>
:root {
  --bg: #061426;
  --panel: rgba(11, 29, 50, 0.75);
  --panel-border: rgba(170, 215, 245, 0.16);
  --text: #eef7ff;
  --muted: #9fb6cc;
  --teal: #00ffcc;
  --blue: #168bff;
  --green: #28dca0;
  --orange: #ffbf57;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: radial-gradient(circle at 20% 20%, #0d2744 0%, #061426 70%);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}
header {
  height: 66px;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(7, 24, 43, 0.85);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--panel-border);
  position: relative;
  z-index: 5;
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
  background: linear-gradient(135deg, #00a9b5, #0758bf); font-size: 22px;
  box-shadow: 0 4px 15px rgba(0, 169, 181, 0.3);
}
header h1 { font-size: 18px; letter-spacing: -0.3px; }
header p { font-size: 12px; color: var(--muted); }
.badge-top {
  font-size: 10px; font-weight: 800; padding: 6px 12px; border-radius: 20px;
  background: rgba(0, 255, 204, 0.08); border: 1px solid rgba(0, 255, 204, 0.25); color: var(--teal);
}
.layout {
  height: calc(100vh - 66px);
  display: grid;
  grid-template-columns: 380px minmax(0, 1fr);
}
.sidebar {
  background: var(--panel);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-right: 1px solid var(--panel-border);
  display: flex;
  flex-direction: column;
  min-height: 0;
  z-index: 2;
}
.filters {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  border-bottom: 1px solid var(--panel-border);
}
input, select {
  width: 100%; min-width: 0; background: rgba(6, 20, 38, 0.8);
  border: 1px solid rgba(42, 73, 104, 0.7); border-radius: 11px; padding: 11px 13px;
  color: white; font: inherit; font-size: 13px; outline: none;
  transition: all 0.2s ease;
}
input:focus, select:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(0, 255, 204, 0.12);
}
select option { background: #0b1d32; color: white; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
button {
  border: 0; border-radius: 11px; padding: 11px 14px;
  background: linear-gradient(110deg, #0788ed, #00a9b5); color: white;
  font-weight: 750; font-size: 12px; cursor: pointer; transition: opacity 0.2s;
}
button:hover { opacity: 0.9; }
button.secondary {
  background: rgba(19, 45, 71, 0.7); border: 1px solid rgba(42, 74, 104, 0.8); color: var(--text);
}
button:disabled { opacity: .5; cursor: wait; }
#statusMsg { font-size: 11px; color: var(--muted); padding: 0 2px; }
#atmList {
  overflow-y: auto; flex: 1; min-height: 0; padding: 12px;
  display: flex; flex-direction: column; gap: 10px;
}
.atm-card {
  background: rgba(12, 32, 53, 0.65); border: 1px solid var(--panel-border);
  border-radius: 13px; padding: 13px; cursor: pointer;
  transition: all 0.2s ease;
}
.atm-card:hover {
  border-color: var(--teal);
  background: rgba(15, 38, 63, 0.85);
  transform: translateY(-1px);
}
.atm-title { font-weight: 750; color: #79dbe1; font-size: 14px; }
.bank { font-size: 12px; font-weight: 650; margin-top: 3px; color: #d0e7ff; }
.address { font-size: 12px; line-height: 1.45; color: var(--muted); margin: 6px 0; }
.badge { display: inline-block; font-size: 10px; padding: 3px 8px; border-radius: 20px; font-weight: 700; }
.verified { background: rgba(40, 220, 160, 0.15); color: var(--green); border: 1px solid rgba(40, 220, 160, 0.3); }
.unverified { background: rgba(255, 191, 87, 0.15); color: var(--orange); border: 1px solid rgba(255, 191, 87, 0.3); }
.tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
.tag { font-size: 10px; padding: 3px 7px; background: rgba(19, 59, 67, 0.8); color: #a8eff0; border-radius: 6px; }
.directions { display: inline-block; margin-top: 8px; color: #80c9ff; text-decoration: none; font-size: 12px; font-weight: 700; }
.directions:hover { text-decoration: underline; }
.map-area { position: relative; min-width: 0; min-height: 0; background: #020916; }
#globeViz { width: 100%; height: 100%; min-height: 300px; }
.map-tools {
  position: absolute; top: 16px; left: 16px; right: 16px;
  display: flex; justify-content: space-between; gap: 8px; pointer-events: none;
}
.map-tools > * { pointer-events: auto; }
.map-chip {
  font-size: 12px; padding: 9px 13px; border: 1px solid var(--panel-border);
  background: rgba(6, 20, 38, 0.82); backdrop-filter: blur(10px);
  border-radius: 11px; color: var(--text); box-shadow: 0 8px 30px rgba(0,0,0,0.3);
}
.map-actions { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 8px; }
.notice { font-size: 11px; color: var(--muted); line-height: 1.45; padding: 12px 16px; border-top: 1px solid var(--panel-border); background: rgba(4, 15, 29, 0.4); }
.empty { padding: 20px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.5; }
@media(max-width: 760px) {
  body { overflow: auto; height: 100dvh; }
  .layout { height: calc(100dvh - 66px); display: flex; flex-direction: column; }
  .map-area { height: 48%; min-height: 260px; flex: none; order: 0; }
  .sidebar { height: 52%; min-height: 0; order: 1; border-right: 0; border-top: 1px solid var(--panel-border); }
  .filters { padding: 12px; gap: 8px; }
  #atmList { padding: 8px; }
  .map-tools { top: 10px; left: 10px; right: 10px; }
  .map-chip { font-size: 11px; padding: 7px 10px; }
  .map-actions { right: 10px; bottom: 10px; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🏧</div>
    <div>
      <h1>BW ATM Finder</h1>
      <p>Interactive 3D Earth & Verified Directory</p>
    </div>
  </div>
  <div class="badge-top">BOTSWANA 🇧🇼</div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="filters">
      <input id="searchInput" placeholder="Search town, landmark, address or ATM…" aria-label="Search ATMs">
      <div class="row">
        <select id="bankFilter" aria-label="Filter by bank">
          <option value="">All Banks</option>
          <option>Stanbic Bank Botswana</option>
          <option>First National Bank (FNB) Botswana</option>
          <option>Standard Chartered Bank Botswana</option>
          <option>Absa Bank Botswana</option>
          <option>Access Bank Botswana</option>
          <option>Bank of Baroda Botswana</option>
          <option>BBS Bank</option>
        </select>
        <select id="serviceFilter" aria-label="Filter by service">
          <option value="">All Services</option>
          <option value="cash_withdrawal">Cash Withdrawal</option>
          <option value="deposit">Cash Deposit</option>
          <option value="foreign_currency">Forex</option>
        </select>
      </div>
      <div class="row">
        <button id="locateBtn" type="button">Use my location</button>
        <button id="resetBtn" class="secondary" type="button">Reset globe</button>
      </div>
      <div id="statusMsg">Loading database…</div>
    </div>
    <div id="atmList"><div class="empty">Loading ATM locations…</div></div>
    <div class="notice">ATM records and coordinate points are verified against official bank directories.</div>
  </aside>

  <section class="map-area" aria-label="Interactive 3D Earth globe">
    <div id="globeViz"></div>
    <div class="map-tools">
      <div class="map-chip">🌍 3D Globe Interactive View</div>
      <div class="map-chip">Tap pin for details</div>
    </div>
    <div class="map-actions">
      <button class="secondary" id="zoomOut" type="button">−</button>
      <button id="zoomIn" type="button">＋ Zoom</button>
    </div>
  </section>
</div>

<script src="https://unpkg.com/globe.gl"></script>
<script>
const DATA_PATHS = [
  "./data/botswana_atms.json",
  "/botswana-atm-finder/data/botswana_atms.json",
  "data/botswana_atms.json",
  "./botswana_atms.json"
];

let atmsData = [], visibleAtms = [], globe, altitude = 1.6;
const $ = id => document.getElementById(id);

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function coords(a) {
  return a.latitude !== null && a.latitude !== undefined && 
         a.longitude !== null && a.longitude !== undefined && 
         a.latitude !== '' && a.longitude !== '' && 
         Number.isFinite(Number(a.latitude)) && Number.isFinite(Number(a.longitude));
}

function initGlobe() {
  if (typeof Globe !== 'function') {
    $('globeViz').innerHTML = '<div class="empty">3D globe library failed to load. Check internet connection.</div>';
    return;
  }
  globe = Globe()($('globeViz'))
    .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
    .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
    .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
    .showAtmosphere(true).atmosphereColor('#168bff').atmosphereAltitude(0.18)
    .pointLat(d => Number(d.latitude)).pointLng(d => Number(d.longitude))
    .pointColor(d => d.verification_status === 'verified' ? '#28dca0' : '#ffbf57')
    .pointAltitude(0.025).pointRadius(d => window.innerWidth < 760 ? 0.28 : 0.22)
    .pointLabel(d => `<div style="background:rgba(7,24,43,0.9);color:white;padding:10px;border:1px solid rgba(0,255,204,0.3);border-radius:10px;max-width:240px;backdrop-filter:blur(8px)"><b>${esc(d.atm_name)}</b><br><span style="color:#00ffcc">${esc(d.bank)}</span><br><small>${esc(d.town)} · ${esc(d.address)}</small></div>`)
    .onPointClick(d => focusAtm(d));

  globe.pointOfView({ lat: -22.3, lng: 24.7, altitude }, 0);
  window.addEventListener('resize', () => {
    if (globe) globe.width($('globeViz').clientWidth).height($('globeViz').clientHeight);
  });
}

function focusAtm(a) {
  if (coords(a) && globe) {
    altitude = 0.35;
    globe.pointOfView({ lat: Number(a.latitude), lng: Number(a.longitude), altitude }, 850);
  }
}

function render(list) {
  visibleAtms = list;
  $('statusMsg').textContent = `Showing ${list.length} ATM location(s)`;
  const withCoords = list.filter(coords);
  if (globe) globe.pointsData(withCoords);

  if (!list.length) {
    $('atmList').innerHTML = '<div class="empty">No matching ATMs found. Try clearing filters.</div>';
    return;
  }

  $('atmList').innerHTML = list.map((a, i) => {
    const verified = a.verification_status === 'verified';
    const serviceTags = (a.services || []).map(s => `<span class="tag">${esc(String(s).replaceAll('_', ' '))}</span>`).join('');
    const direction = coords(a) 
      ? `<a class="directions" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(a.latitude+','+a.longitude)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🧭 Directions in Google Maps</a>` 
      : '<div class="address" style="color:#ffbf57">📍 Coordinates pending verification</div>';

    return `<article class="atm-card" data-index="${i}" tabindex="0">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:start">
        <div class="atm-title">${esc(a.atm_name || 'ATM location')}</div>
        <span class="badge ${verified ? 'verified' : 'unverified'}">${esc((a.verification_status || 'unverified').replaceAll('_', ' '))}</span>
      </div>
      <div class="bank">${esc(a.bank || 'Bank not specified')}</div>
      <div class="address">📍 <b>${esc(a.town || 'Town unknown')}</b> — ${esc(a.address || 'Address not listed')}${a.landmark ? ' · '+esc(a.landmark) : ''}</div>
      <div class="tags">${serviceTags}</div>
      ${direction}
    </article>`;
  }).join('');

  $('atmList').querySelectorAll('.atm-card').forEach(card => {
    const select = () => focusAtm(list[Number(card.dataset.index)]);
    card.addEventListener('click', select);
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(); } });
  });
}

function filterAtms() {
  const q = $('searchInput').value.trim().toLowerCase();
  const bank = $('bankFilter').value;
  const service = $('serviceFilter').value;

  render(atmsData.filter(a => {
    const hay = [a.atm_name, a.bank, a.town, a.district, a.address, a.landmark].filter(Boolean).join(' ').toLowerCase();
    return (!q || hay.includes(q)) && 
           (!bank || a.bank === bank) && 
           (!service || (a.services || []).some(s => String(s).includes(service)));
  }));
}

async function loadAtms() {
  let loaded = false;
  for (const path of DATA_PATHS) {
    try {
      const r = await fetch(path);
      if (r.ok) {
        const data = await r.json();
        if (Array.isArray(data)) {
          atmsData = data;
          loaded = true;
          break;
        }
      }
    } catch (err) {
      console.warn(`Attempt failed for path: ${path}`);
    }
  }

  if (!loaded) {
    $('statusMsg').textContent = 'Error loading ATM database';$('atmList').innerHTML = `<div class="empty">Could not load <code>data/botswana_atms.json</code>.<br>Verify repository file path.</div>`;
    return;
  }

  filterAtms();
  const valid = atmsData.filter(coords);
  if (globe) globe.pointsData(valid);
  if (valid.length && globe) {
    const lat = valid.reduce((s, a) => s + Number(a.latitude), 0) / valid.length;
    const lon = valid.reduce((s, a) => s + Number(a.longitude), 0) / valid.length;
    globe.pointOfView({ lat, lng: lon, altitude: 2.2 }, 900);
  }
}

$('searchInput').addEventListener('input', filterAtms);
$('bankFilter').addEventListener('change', filterAtms);$('serviceFilter').addEventListener('change', filterAtms);

$('resetBtn').addEventListener('click', () => {
  altitude = 1.6;
  if (globe) globe.pointOfView({ lat: -22.3, lng: 24.7, altitude }, 800);
});

$('zoomIn').addEventListener('click', () => {
  if (globe) {
    altitude = Math.max(0.12, altitude * 0.72);
    const p = globe.pointOfView();
    globe.pointOfView({ ...p, altitude }, 500);
  }
});

$('zoomOut').addEventListener('click', () => {
  if (globe) {
    altitude = Math.min(5, altitude * 1.35);
    const p = globe.pointOfView();
    globe.pointOfView({ ...p, altitude }, 500);
  }
});

$('locateBtn').addEventListener('click', () => {
  if (!navigator.geolocation) {
    alert('Geolocation is not supported by your browser.');
    return;
  }
  $('locateBtn').disabled = true;
  $('locateBtn').textContent = 'Locating…';

  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude, longitude } = pos.coords;
    if (globe) {
      altitude = 0.45;
      globe.pointOfView({ lat: latitude, lng: longitude, altitude }, 900);
    }
    const nearby = atmsData.filter(coords).map(a => ({
      ...a, 
      _distance: distance(latitude, longitude, Number(a.latitude), Number(a.longitude))
    })).sort((a, b) => a._distance - b._distance);

    $('searchInput').value = '';
    render(nearby);
    $('statusMsg').textContent = `${nearby.length} records sorted by distance`;
    
    $('atmList').querySelectorAll('.atm-card').forEach((card, i) => {
      const a = nearby[i], meta = card.querySelector('.address');
      if (a && meta) meta.insertAdjacentHTML('beforeend', `<br><b style="color:#00ffcc">${a._distance.toFixed(1)} km away</b>`);
    });
    $('locateBtn').disabled = false;
    $('locateBtn').textContent = 'Use my location';
  }, () => {
    alert('Could not access location. Please check permissions.');
    $('locateBtn').disabled = false;
    $('locateBtn').textContent = 'Use my location';
  }, { enableHighAccuracy: true, timeout: 12000 });
});

function distance(a, b, c, d) {
  const rad = n => n * Math.PI / 180, dl = rad(c - a), dn = rad(d - b);
  const x = Math.sin(dl / 2)**2 + Math.cos(rad(a)) * Math.cos(rad(c)) * Math.sin(dn / 2)**2;
  return 6371 * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}

initGlobe();
loadAtms();
</script>
</body>
</html>
