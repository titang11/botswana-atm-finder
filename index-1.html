<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061426">
<title>BW ATM Finder — 3D Globe</title>
<style>
:root{--primary:#008f9a;--bg:#061426;--panel:#0b1d32;--text:#eef7ff;--muted:#9fb6cc;--border:#203b59}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
header{height:66px;padding:10px 16px;display:flex;align-items:center;gap:12px;background:#07182b;border-bottom:1px solid var(--border);position:relative;z-index:5}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#00a9b5,#0758bf);font-size:22px}
header h1{font-size:18px}header p{font-size:12px;color:var(--muted)}
.layout{height:calc(100vh - 66px);display:grid;grid-template-columns:360px minmax(0,1fr)}
.sidebar{background:#091a2d;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;z-index:2}
.filters{padding:14px;display:flex;flex-direction:column;gap:9px;border-bottom:1px solid var(--border)}
input,select{width:100%;min-width:0;background:#061426;border:1px solid #2a4968;border-radius:9px;padding:11px;color:white;font:inherit;font-size:13px}
.row{display:flex;gap:8px}.row>*{flex:1}
button{border:0;border-radius:9px;padding:10px 12px;background:#0788ed;color:white;font-weight:700;font-size:12px;cursor:pointer}
button.secondary{background:#132d47;border:1px solid #2a4a68}
button:disabled{opacity:.5}
#count{font-size:12px;color:var(--muted)}
#atmList{overflow-y:auto;flex:1;min-height:0;padding:10px;display:flex;flex-direction:column;gap:9px}
.atm-card{background:#0c2035;border:1px solid #203d5a;border-radius:11px;padding:12px;cursor:pointer}
.atm-card:hover{border-color:#00aab7}.atm-title{font-weight:750;color:#79dbe1;font-size:14px}
.bank{font-size:12px;font-weight:650;margin-top:3px}.address{font-size:12px;line-height:1.45;color:var(--muted);margin:6px 0}
.badge{display:inline-block;font-size:10px;padding:3px 7px;border-radius:20px;background:#28405a;color:#d7e8f8}
.verified{background:#174b3c;color:#aaf0d0}.unverified{background:#58421d;color:#ffdf9a}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.tag{font-size:10px;padding:3px 6px;background:#133b43;color:#a8eff0;border-radius:5px}
.directions{display:inline-block;margin-top:8px;color:#80c9ff;text-decoration:none;font-size:12px;font-weight:700}
.map-area{position:relative;min-width:0;min-height:0;background:#020916}
#globeViz{width:100%;height:100%;min-height:300px}
.map-tools{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.map-tools>*{pointer-events:auto}
.map-chip{font-size:12px;padding:9px 11px;border:1px solid #294765;background:#061426d9;border-radius:10px;color:#dceeff}
.map-actions{position:absolute;right:12px;bottom:12px;display:flex;gap:7px}
.notice{font-size:11px;color:var(--muted);line-height:1.45;padding:10px 13px;border-top:1px solid var(--border)}
.empty{padding:15px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}
@media(max-width:760px){
 body{overflow:auto;height:100dvh}.layout{height:calc(100dvh - 66px);display:flex;flex-direction:column}
 .map-area{height:48%;min-height:260px;flex:none;order:0}
 .sidebar{height:52%;min-height:0;order:1;border-right:0}
 .filters{padding:10px;gap:7px}#atmList{padding:8px}
 .map-tools{top:8px;left:8px;right:8px}.map-chip{font-size:11px;padding:7px 8px}.map-actions{right:8px;bottom:8px}
}
</style>
</head>
<body>
<header><div class="logo">🏧</div><div><h1>BW ATM Finder</h1><p>Explore the globe. Find ATMs across Botswana.</p></div></header>
<div class="layout">
  <aside class="sidebar">
    <div class="filters">
      <input id="searchInput" placeholder="Search town, landmark, address or ATM…" aria-label="Search ATMs">
      <div class="row">
        <select id="bankFilter" aria-label="Filter by bank">
          <option value="">All Banks</option>
          <option>Stanbic Bank Botswana</option><option>First National Bank (FNB) Botswana</option>
          <option>Standard Chartered Bank Botswana</option><option>Absa Bank Botswana</option>
          <option>Access Bank Botswana</option><option>Bank of Baroda Botswana</option><option>BBS Bank</option>
        </select>
        <select id="serviceFilter" aria-label="Filter by service">
          <option value="">All Services</option><option value="cash_withdrawal">Cash Withdrawal</option>
          <option value="deposit">Cash Deposit</option><option value="foreign_currency">Forex</option>
        </select>
      </div>
      <div class="row"><button id="locateBtn" type="button">Use my location</button><button id="resetBtn" class="secondary" type="button">Reset globe</button></div>
      <div id="count">Loading ATM directory…</div>
    </div>
    <div id="atmList"><div class="empty">Loading ATM locations…</div></div>
    <div class="notice">ATM records and coordinates may need verification. Map tiles and globe imagery require an internet connection.</div>
  </aside>
  <section class="map-area" aria-label="Interactive 3D Earth globe">
    <div id="globeViz"></div>
    <div class="map-tools"><div class="map-chip">🌍 Interactive 3D Earth</div><div class="map-chip">Tap an ATM pin for details</div></div>
    <div class="map-actions"><button class="secondary" id="zoomOut" type="button">−</button><button id="zoomIn" type="button">＋ Zoom</button></div>
  </section>
</div>
<script src="https://unpkg.com/globe.gl"></script>
<script>
let atmsData=[], visibleAtms=[], globe, altitude=1.6;
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function coords(a){return a.latitude!==null&&a.latitude!==undefined&&a.longitude!==null&&a.longitude!==undefined&&a.latitude!==''&&a.longitude!==''&&Number.isFinite(Number(a.latitude))&&Number.isFinite(Number(a.longitude));}
function initGlobe(){
 if(typeof Globe!=='function'){$('globeViz').innerHTML='<div class="empty">The 3D globe library failed to load. Check your internet connection and refresh.</div>';return;}
 globe=Globe()($('globeViz'))
  .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
  .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
  .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
  .showAtmosphere(true).atmosphereColor('#168bff').atmosphereAltitude(.18)
  .pointLat(d=>Number(d.latitude)).pointLng(d=>Number(d.longitude))
  .pointColor(d=>d.verification_status==='verified'?'#28dca0':'#ffbf57')
  .pointAltitude(.025).pointRadius(d=>window.innerWidth<760?.28:.22)
  .pointLabel(d=>`<div style="background:#07182b;color:white;padding:9px;border:1px solid #278cba;border-radius:8px;max-width:240px"><b>${esc(d.atm_name)}</b><br>${esc(d.bank)}<br><small>${esc(d.town)} · ${esc(d.address)}</small></div>`)
  .onPointClick(d=>focusAtm(d));
 globe.pointOfView({lat:-22.3,lng:24.7,altitude},0);
 window.addEventListener('resize',()=>{if(globe)globe.width($('globeViz').clientWidth).height($('globeViz').clientHeight);});
}
function focusAtm(a){if(coords(a)&&globe){altitude=.35;globe.pointOfView({lat:Number(a.latitude),lng:Number(a.longitude),altitude},850);}}
function render(list){
 visibleAtms=list;
 $('count').textContent=`Showing ${list.length} ATM location(s)`;
 const withCoords=list.filter(coords);
 if(globe)globe.pointsData(withCoords);
 if(!list.length){$('atmList').innerHTML='<div class="empty">No matching ATMs. Try another search or clear a filter.</div>';return;}
 $('atmList').innerHTML=list.map((a,i)=>{
  const verified=a.verification_status==='verified';
  const serviceTags=(a.services||[]).map(s=>`<span class="tag">${esc(String(s).replaceAll('_',' '))}</span>`).join('');
  const direction=coords(a)?`<a class="directions" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(a.latitude+','+a.longitude)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🧭 Directions in Google Maps</a>`:'<div class="address">📍 Coordinates to be confirmed</div>';
  return `<article class="atm-card" data-index="${i}" tabindex="0">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><div class="atm-title">${esc(a.atm_name||'ATM location')}</div><span class="badge ${verified?'verified':'unverified'}">${esc((a.verification_status||'unverified').replaceAll('_',' '))}</span></div>
    <div class="bank">${esc(a.bank||'Bank not specified')}</div>
    <div class="address">📍 <b>${esc(a.town||'Town unknown')}</b> — ${esc(a.address||'Address not listed')}${a.landmark?' · '+esc(a.landmark):''}</div>
    <div class="tags">${serviceTags}</div>${direction}</article>`;
 }).join('');
 $('atmList').querySelectorAll('.atm-card').forEach(card=>{
  const select=()=>focusAtm(list[Number(card.dataset.index)]);
  card.addEventListener('click',select);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select();}});
 });
}
function filterAtms(){
 const q=$('searchInput').value.trim().toLowerCase(),bank=$('bankFilter').value,service=$('serviceFilter').value;
 render(atmsData.filter(a=>{
  const hay=[a.atm_name,a.bank,a.town,a.district,a.address,a.landmark].filter(Boolean).join(' ').toLowerCase();
  return (!q||hay.includes(q))&&(!bank||a.bank===bank)&&(!service||(a.services||[]).some(s=>String(s).includes(service)));
 }));
}
async function loadAtms(){
 try{
  const r=await fetch('./data/botswana_atms.json');
  if(!r.ok)throw Error('Could not load ./data/botswana_atms.json');
  const data=await r.json();if(!Array.isArray(data))throw Error('ATM database must be a JSON array.');
  atmsData=data;filterAtms();
  const valid=atmsData.filter(coords);
  if(globe)globe.pointsData(valid);
  if(valid.length&&globe){
   const lat=valid.reduce((s,a)=>s+Number(a.latitude),0)/valid.length,lon=valid.reduce((s,a)=>s+Number(a.longitude),0)/valid.length;
   globe.pointOfView({lat,lng:lon,altitude:2.2},900);
  }
 }catch(e){
  console.error(e);$('count').textContent='ATM database could not be loaded';
  $('atmList').innerHTML=`<div class="empty">Could not load <code>data/botswana_atms.json</code>.<br><br>Check that your GitHub repository contains this file at that exact path. The app does not invent ATM locations.</div>`;
 }
}
$('searchInput').addEventListener('input',filterAtms);
$('bankFilter').addEventListener('change',filterAtms);
$('serviceFilter').addEventListener('change',filterAtms);
$('resetBtn').addEventListener('click',()=>{altitude=1.6;if(globe)globe.pointOfView({lat:-22.3,lng:24.7,altitude},800);});
$('zoomIn').addEventListener('click',()=>{if(globe){altitude=Math.max(.12,altitude*.72);const p=globe.pointOfView();globe.pointOfView({...p,altitude},500);}});
$('zoomOut').addEventListener('click',()=>{if(globe){altitude=Math.min(5,altitude*1.35);const p=globe.pointOfView();globe.pointOfView({...p,altitude},500);}});
$('locateBtn').addEventListener('click',()=>{
 if(!navigator.geolocation){alert('Location is not supported by this browser.');return;}
 $('locateBtn').disabled=true;$('locateBtn').textContent='Locating…';
 navigator.geolocation.getCurrentPosition(pos=>{
  const {latitude,longitude}=pos.coords;
  if(globe){altitude=.45;globe.pointOfView({lat:latitude,lng:longitude,altitude},900);}
  const nearby=atmsData.filter(coords).map(a=>({...a,_distance:distance(latitude,longitude,Number(a.latitude),Number(a.longitude))})).sort((a,b)=>a._distance-b._distance);
  $('searchInput').value='';
  render(nearby);
  $('count').textContent=`${nearby.length} directory record(s), sorted by distance from your location`;
  $('atmList').querySelectorAll('.atm-card').forEach((card,i)=>{
   const a=nearby[i],meta=card.querySelector('.address');
   if(a&&meta)meta.insertAdjacentHTML('beforeend',`<br><b>${a._distance.toFixed(1)} km away</b>`);
  });
  $('locateBtn').disabled=false;$('locateBtn').textContent='Use my location';
 },()=>{alert('Could not access location. Allow location permission or use search.');$('locateBtn').disabled=false;$('locateBtn').textContent='Use my location';},{enableHighAccuracy:true,timeout:12000});
});
function distance(a,b,c,d){const rad=n=>n*Math.PI/180,dl=rad(c-a),dn=rad(d-b),x=Math.sin(dl/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dn/2)**2;return 6371*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
initGlobe();loadAtms();
</script>
</body>
</html>
