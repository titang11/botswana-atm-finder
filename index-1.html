
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#061426">
<title>BW ATM Finder</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#061426;color:#eef7ff}
header{padding:14px;background:#0b1d32;border-bottom:1px solid #28405a}
header h2{margin:0;font-size:20px}
header p{margin:5px 0 0;color:#a9bfd3;font-size:13px}
main{display:grid;grid-template-columns:360px 1fr;height:calc(100dvh - 68px)}
.sidebar{display:flex;flex-direction:column;min-height:0;background:#091a2d}
.controls{padding:12px;display:grid;gap:8px}
input,select,button{width:100%;padding:11px;border-radius:8px;font-size:14px}
input,select{background:#061426;color:white;border:1px solid #34516d}
button{border:0;background:#0788ed;color:white;font-weight:bold}
button.secondary{background:#20364d}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
#status{font-size:12px;color:#a9bfd3;line-height:1.5}
#atmList{overflow:auto;min-height:0;padding:9px}
.card{padding:12px;margin-bottom:9px;border:1px solid #29435c;border-radius:9px;background:#0c2035}
.card h3{font-size:14px;margin:0 0 6px;color:#79dbe1}
.card p{font-size:12px;line-height:1.5;margin:4px 0;color:#d6e4f1}
.card a{display:inline-block;margin-top:8px;color:#80c9ff;font-size:12px}
#map{height:100%;min-height:300px;background:#dbe6ee}
@media(max-width:700px){
 main{display:flex;flex-direction:column;height:auto;min-height:calc(100dvh - 68px)}
 #map{height:43dvh;min-height:280px;flex:none;order:0}
 .sidebar{height:55dvh;min-height:350px;order:1}
 .controls{padding:9px}
}
</style>
</head>
<body>

<header>
<h2>🏧 BW ATM Finder</h2>
<p>Find ATM locations across Botswana</p>
</header>

<main>
<section class="sidebar">
<div class="controls">
<input id="search" placeholder="Search town, bank, address or landmark">
<select id="bank">
<option value="">All banks</option>
<option>Stanbic Bank Botswana</option>
<option>First National Bank (FNB) Botswana</option>
<option>Standard Chartered Bank Botswana</option>
<option>Absa Bank Botswana</option>
<option>Access Bank Botswana</option>
<option>Bank of Baroda Botswana</option>
<option>BBS Bank</option>
</select>
<select id="service">
<option value="">All services</option>
<option value="cash_withdrawal">Cash withdrawal</option>
<option value="deposit">Cash deposit</option>
<option value="foreign_currency">Forex</option>
</select>
<div class="row">
<button id="locate">📍 My location</button>
<button id="reset" class="secondary">Botswana</button>
</div>
<div id="status">Starting map and loading ATM directory…</div>
</div>
<div id="atmList"></div>
</section>
<div id="map" aria-label="Map showing ATM locations"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
let records = [];
let markers = [];
let userMarker = null;
let userCircle = null;
let userPosition = null;

const map = L.map('map').setView([-22.3285, 24.6849], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

function hasCoords(a) {
  const lat = Number(a.latitude);
  const lng = Number(a.longitude);
  return a.latitude !== null && a.latitude !== '' &&
         a.longitude !== null && a.longitude !== '' &&
         Number.isFinite(lat) && Number.isFinite(lng) &&
         lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;
}

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;',
    '"':'&quot;', "'":'&#39;'
  })[c]);
}

function distance(lat1, lng1, lat2, lng2) {
  const rad = n => n * Math.PI / 180;
  const dLat = rad(lat2 - lat1);
  const dLng = rad(lng2 - lng1);
  const x = Math.sin(dLat/2)**2 +
    Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLng/2)**2;
  return 6371 * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

function directions(a) {
  if (!hasCoords(a)) return '';
  const url = 'https://www.google.com/maps/dir/?api=1&destination=' +
    encodeURIComponent(a.latitude + ',' + a.longitude);
  return `<a href="${url}" target="_blank" rel="noopener">🧭 Get directions in Google Maps</a>`;
}

function render() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  const query = $('search').value.trim().toLowerCase();
  const bank = $('bank').value;
  const service = $('service').value;

  let filtered = records.filter(a => {
    const text = [
      a.atm_name, a.bank, a.town, a.district,
      a.address, a.landmark
    ].filter(Boolean).join(' ').toLowerCase();

    return (!query || text.includes(query)) &&
      (!bank || a.bank === bank) &&
      (!service || (a.services || []).some(s => String(s).includes(service)));
  });

  if (userPosition) {
    filtered.sort((a,b) => {
      const da = hasCoords(a) ?
        distance(userPosition.lat,userPosition.lng,+a.latitude,+a.longitude) : Infinity;
      const db = hasCoords(b) ?
        distance(userPosition.lat,userPosition.lng,+b.latitude,+b.longitude) : Infinity;
      return da-db;
    });
  }

  $('atmList').innerHTML = '';
  $('status').textContent = `Showing ${filtered.length} of ${records.length} ATM records.`;

  if (!filtered.length) {
    $('atmList').innerHTML = '<p>No matching records. Try changing your search.</p>';
  }

  filtered.forEach(a => {
    let km = null;

    if (userPosition && hasCoords(a)) {
      km = distance(userPosition.lat,userPosition.lng,+a.latitude,+a.longitude);
    }

    const card = document.createElement('article');
    card.className = 'card';

    const title = esc(a.atm_name || 'ATM location');
    const bankName = esc(a.bank || 'Bank not specified');
    const town = esc(a.town || 'Town not specified');
    const address = esc(a.address || 'Address not listed');
    const landmark = esc(a.landmark || '');
    const verified = esc(a.verification_status || 'unverified');

    card.innerHTML = `
      <h3>${title}</h3>
      <p><b>${bankName}</b></p>
      <p>📍 ${town} — ${address} ${landmark ? ' · '+landmark : ''}</p>
      <p>Status: ${verified}</p>
      ${km !== null ? `<p><b>${km.toFixed(1)} km away</b></p>` : ''}
      ${directions(a)}
    `;

    $('atmList').appendChild(card);

    if (hasCoords(a)) {
      const marker = L.marker([+a.latitude,+a.longitude]).addTo(map);

      marker.bindPopup(
        `<b>${title}</b><br>${bankName}<br>${town}<br>${address}<br>${directions(a)}`
      );

      marker.on('click', () => card.scrollIntoView({
        behavior:'smooth', block:'nearest'
      }));

      card.style.cursor = 'pointer';
      card.addEventListener('click', e => {
        if (e.target.closest('a')) return;
        map.setView([+a.latitude,+a.longitude],15);
        marker.openPopup();
      });

      markers.push(marker);
    } else {
      card.innerHTML += '<p>Coordinates not available; map pin cannot be shown.</p>';
    }
  });
}

async function loadData() {
  $('status').textContent = 'Loading ATM directory…';

  try {
    const response = await fetch('./data/botswana_atms.json');

    if (!response.ok) {
      throw new Error('Database returned HTTP ' + response.status);
    }

    const data = await response.json();

    if (!Array.isArray(data)) {
      throw new Error('The ATM file must contain a JSON array.');
    }

    records = data;
    render();

    const mapped = records.filter(hasCoords);

    if (mapped.length) {
      const bounds = L.latLngBounds(
        mapped.map(a => [+a.latitude,+a.longitude])
      );
      map.fitBounds(bounds, {padding:[25,25], maxZoom:10});
    }

    $('status').textContent =
      `Loaded ${records.length} records; ${mapped.length} have map coordinates.`;
  } catch (error) {
    console.error('ATM loading error:', error);
    $('status').textContent = 'Could not load ATM data: ' + error.message;
    $('atmList').innerHTML =
      '<p class="card">Check that data/botswana_atms.json exists in your GitHub repository and contains valid JSON. Your data file has not been changed.</p>';
  }
}

$('search').addEventListener('input', render);
$('bank').addEventListener('change', render);
$('service').addEventListener('change', render);

$('reset').addEventListener('click', () => {
  userPosition = null;
  map.setView([-22.3285,24.6849],6);
  render();
});

$('locate').addEventListener('click', () => {
  if (!navigator.geolocation) {
    alert('Your browser does not support location services.');
    return;
  }

  $('locate').disabled = true;
  $('locate').textContent = 'Locating…';

  navigator.geolocation.getCurrentPosition(position => {
    userPosition = {
      lat:position.coords.latitude,
      lng:position.coords.longitude
    };

    if (userMarker) map.removeLayer(userMarker);
    if (userCircle) map.removeLayer(userCircle);

    userMarker = L.marker([userPosition.lat,userPosition.lng])
      .addTo(map).bindPopup('You are here').openPopup();

    userCircle = L.circle([userPosition.lat,userPosition.lng], {
      radius:position.coords.accuracy,
      color:'#0788ed'
    }).addTo(map);

    map.setView([userPosition.lat,userPosition.lng],13);
    render();

    $('status').textContent =
      `Your location found. GPS accuracy: about ${Math.round(position.coords.accuracy)} metres.`;

    $('locate').disabled = false;
    $('locate').textContent = '📍 My location';
  }, error => {
    const messages = {
      1:'Location permission denied. Allow location access in Chrome site settings.',
      2:'Phone location unavailable. Turn on Android Location and try again.',
      3:'Location timed out. Try again outdoors or with a better signal.'
    };

    alert(messages[error.code] || 'Could not determine your location.');
    $('locate').disabled = false;
    $('locate').textContent = '📍 My location';
  }, {
    enableHighAccuracy:false,
    timeout:30000,
    maximumAge:60000
  });
});

loadData();
setTimeout(() => map.invalidateSize(), 300);
</script>
</body>
</html>
